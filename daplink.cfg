# One configuration file for both workflows:
#   Default: use the on-board F042 CMSIS-DAP to debug the STM32F103CB target.
#   Program F042: openocd -c "set DAP_TARGET f042" -f daplink.cfg ...
adapter driver cmsis-dap
cmsis-dap backend hid
if {[info exists DAP_SERIAL]} {
    adapter serial $DAP_SERIAL
}
transport select swd

if {![info exists DAP_TARGET]} {
    set DAP_TARGET f103
}

if {$DAP_TARGET eq "f042"} {
    set CHIPNAME stm32f042
    set FLASH_SIZE 0x8000
    set WORKAREASIZE 0x1000
    source [find target/stm32f0x.cfg]

    # External PowerWriter programs the F042 reliably at this speed.
    adapter speed 1000
} else {
    set CHIPNAME stm32f103
    set FLASH_SIZE 0x20000
    set WORKAREASIZE 0x5000
    source [find target/stm32f1x.cfg]

    # The on-board probe uses HAL GPIO bit-bang; start conservatively.
    adapter speed 100
}
